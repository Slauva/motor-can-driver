[project]
name = "can-motor"
version = "0.2.0"
description = "Motor control over the LK-TECH CAN V2.35 protocol with explicit host limits"
readme = "README.md"
requires-python = ">=3.11,<3.16"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    # The USB backend adapts these versions' low-level frame and cleanup API.
    "python-can[gs-usb]==4.6.1",
    "gs-usb==0.3.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["can_motor", "can_motor.*"]
namespaces = false

[tool.setuptools.package-data]
can_motor = ["py.typed"]
