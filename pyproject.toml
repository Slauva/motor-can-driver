[project]
name = "can-motor"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-can[gs-usb]>=4.6.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Expose editable sources through a path-based .pth file for Pylance/Pyright.
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["packages", "packages.*"]
namespaces = false

[tool.setuptools.package-data]
packages = ["py.typed"]
